version: "3.9"

networks:
  global-network:

volumes:
  pgdata:

services:

  # Frontend Vue
  vuejs_node:
    image: node:20-alpine
    container_name: vuejs_node
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./s5-cloud-final/frontend-vueJS/frontend-vueJS:/app
    ports:
      - "5173:5173"
    networks:
      - global-network
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - NODE_OPTIONS=--max-old-space-size=2048

  # Offline map
  tileserver:
    image: maptiler/tileserver-gl-light
    container_name: tileserver
    ports:
      - "8081:8080"
    volumes:
      - ./offline-map/data/madagascar_antananarivo.mbtiles:/data/madagascar_antananarivo.mbtiles
    networks:
      - global-network

  # Laravel DB
  laravel_db:
    image: postgres:16
    container_name: laravel_db
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laraveluser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - global-network

  # Laravel App
  laravel_app:
    build:
      context: ./s5-cloud-final/laravel-auth-docker
      dockerfile: dockerfile
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - ./s5-cloud-final/laravel-auth-docker:/var/www
    networks:
      - global-network
    depends_on:
      - laravel_db

  # Laravel Web (Nginx)
  laravel_web:
    image: nginx:latest
    container_name: laravel_web
    ports:
      - "8000:80"
    volumes:
      - ./s5-cloud-final/laravel-auth-docker:/var/www
      - ./s5-cloud-final/laravel-auth-docker/ngnix/conf.d:/etc/nginx/conf.d
    networks:
      - global-network
    depends_on:
      - laravel_app
